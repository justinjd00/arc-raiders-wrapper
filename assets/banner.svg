<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">arc-raiders-api</title>
  <desc id="desc">Type-safe TypeScript SDK for the MetaForge ARC Raiders API</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .sweep { transform-origin: 1000px 236px; transform-box: view-box; animation: spin 7s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .ping { transform-origin: center; transform-box: fill-box; animation: ping 3.5s ease-out infinite; }
    .ping.b { animation-delay: 1.2s; }
    .ping.c { animation-delay: 2.3s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes ping { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; } 100% { opacity: 0; transform: scale(2.4); } }
    @media (prefers-reduced-motion: reduce) { .sweep, .blink, .ping { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090c16"/>
      <stop offset="1" stop-color="#151b30"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".55" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#e63946"/>
    </linearGradient>
    <radialGradient id="glow" cx="1000" cy="236" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="bands">
      <rect x="820" y="0" width="360" height="250"/>
      <rect x="820" y="257" width="360" height="11"/>
      <rect x="820" y="278" width="360" height="12"/>
      <rect x="820" y="303" width="360" height="13"/>
      <rect x="820" y="333" width="360" height="40"/>
    </clipPath>
    <clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath>
    <clipPath id="radarClip"><circle cx="1000" cy="236" r="150"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- striped sunset -->
    <circle cx="1000" cy="236" r="150" fill="url(#sun)" clip-path="url(#bands)"/>

    <!-- radar overlay -->
    <g clip-path="url(#radarClip)" opacity=".9">
      <circle cx="1000" cy="236" r="50" fill="none" stroke="#0b1020" stroke-opacity=".35"/>
      <circle cx="1000" cy="236" r="100" fill="none" stroke="#0b1020" stroke-opacity=".35"/>
      <path d="M850 236H1150M1000 86V386" stroke="#0b1020" stroke-opacity=".3"/>
      <g class="sweep">
        <path d="M1000 236 L1150 236 A150 150 0 0 0 1129.9 161 Z" fill="url(#beam)"/>
        <line x1="1000" y1="236" x2="1150" y2="236" stroke="#2ee6d6" stroke-width="2" stroke-opacity=".9"/>
      </g>
    </g>
    <g fill="#2ee6d6">
      <circle class="ping" cx="1062" cy="196" r="5"/>
      <circle class="ping b" cx="944" cy="168" r="4"/>
      <circle class="ping c" cx="1088" cy="270" r="4"/>
    </g>

    <!-- horizon and floor -->
    <line x1="700" y1="336" x2="1280" y2="336" stroke="#ff7a3d" stroke-opacity=".55"/>
    <g stroke="#ff7a3d" stroke-opacity=".18">
      <line x1="1000" y1="336" x2="760" y2="360"/>
      <line x1="1000" y1="336" x2="880" y2="360"/>
      <line x1="1000" y1="336" x2="1000" y2="360"/>
      <line x1="1000" y1="336" x2="1120" y2="360"/>
      <line x1="1000" y1="336" x2="1240" y2="360"/>
    </g>

    <!-- retro accent stripes -->
    <g transform="translate(72 64)">
      <rect width="52" height="6" fill="#ffd166"/>
      <rect y="10" width="52" height="6" fill="#ff7a3d"/>
      <rect y="20" width="52" height="6" fill="#e63946"/>
      <rect y="30" width="52" height="6" fill="#2ee6d6"/>
    </g>

    <text x="140" y="80" class="mono" font-size="14" letter-spacing="3" fill="#9aa4bf">METAFORGE  ·  ARC RAIDERS  ·  TYPESCRIPT SDK</text>

    <text x="70" y="176" class="sans" font-size="78" font-weight="800" fill="#f5f7ff" letter-spacing="-1.5">arc-raiders<tspan fill="#ff7a3d">-api</tspan><tspan class="blink" fill="#2ee6d6">_</tspan></text>

    <text x="72" y="222" class="sans" font-size="23" fill="#c9d1e6">Items, quests, ARCs, traders, live events and map markers.</text>
    <text x="72" y="254" class="sans" font-size="23" fill="#c9d1e6">Typed, cached, retried and ready for React and the terminal.</text>

    <!-- chips -->
    <g class="mono" font-size="14" fill="#f5f7ff">
      <g transform="translate(72 286)">
        <rect width="132" height="32" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="16" cy="16" r="4" fill="#2ee6d6"/>
        <text x="28" y="21">0 runtime deps</text>
      </g>
      <g transform="translate(214 286)">
        <rect width="118" height="32" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="16" cy="16" r="4" fill="#ffd166"/>
        <text x="28" y="21">ESM + CJS</text>
      </g>
      <g transform="translate(342 286)">
        <rect width="132" height="32" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="16" cy="16" r="4" fill="#ff7a3d"/>
        <text x="28" y="21">React hooks</text>
      </g>
      <g transform="translate(484 286)">
        <rect width="82" height="32" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="16" cy="16" r="4" fill="#e63946"/>
        <text x="28" y="21">CLI</text>
      </g>
      <g transform="translate(576 286)">
        <rect width="150" height="32" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="16" cy="16" r="4" fill="#9b8cff"/>
        <text x="28" y="21">npm provenance</text>
      </g>
    </g>
  </g>
</svg>
